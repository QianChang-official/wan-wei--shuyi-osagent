# High-signal CI lint baseline. Full style enforcement can be enabled after module split.
# CI 强卡规则(ci.yml --select)：E9,F63,F7,F82 语法/未定义名 + F811 重复定义 + F841 死变量。
# F811/F841 专拦"插新不删旧"类坏补丁产生的重复定义与赋而未用的死代码。
target-version = "py310"
line-length = 120

[lint]
select = [
    "E9",   # Syntax errors
    "F63",  # Syntax errors in f-strings
    "F7",   # Syntax errors
    "F82",  # Undefined names
    "E4",   # Module import conventions
    "E5",   # Line length / whitespace
    "W",    # Warnings
    "F",    # Pyflakes (complete)
    "B",    # Bugbear (common bug patterns)
    "C4",   # Comprehensions
    "UP",   # Pyupgrade (Python version upgrade)
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "B905",  # zip() without strict= (Python 3.10+)
]

[lint.pydocstyle]
convention = "google"
