name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/console-vue/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m pip_audit -r backend/requirements-dev.txt
      - working-directory: frontend/console-vue
        run: npm audit --audit-level=high

  image-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wanwei-shuyi:security-scan
          # 安全扫描应基于当前依赖解析结果,不用 gha 缓存(缓存层冻结历史解析快照,
          # 会放大诊断噪音;本仓库镜像全量构建实测仅约 30s)。
          no-cache: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wanwei-shuyi:security-scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # trivy-action 的 SARIF 分支默认 unset severity 做全量扫描,exit-code 会
          # 对 MEDIUM 级也判 1(门禁实为"任何级别零容忍",与本处声明的 HIGH,CRITICAL
          # 口径不符——这是此前 main 与全部 PR 连锁红的主因: pip 26.1.2 的 MEDIUM
          # CVE-2026-13346 全量命中)。设为 true 使 SARIF 与门禁同口径。
          limit-severities-for-sarif: "true"
          ignore-unfixed: true
          exit-code: "1"
          version: "v0.74.0"
          # 显式声明豁免文件(trivy 对 image 扫描的 cwd 默认读取不可靠,实证未生效;
          # action 的 trivyignores 机制会 export TRIVY_IGNOREFILE,实证生效)
          trivyignores: .trivyignore
      - if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
