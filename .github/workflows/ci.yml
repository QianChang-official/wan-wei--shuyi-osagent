name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/app
      - run: python -m ruff check backend/app --config ruff.toml --select E9,F63,F7,F82,F811,F841
      # bandit 安全静态扫描(非阻断):结果上传为 artifact,趋势由安全审阅例行消化。
      # 不直接 fail 的原因:存量代码有历史告警需要逐条甄别是否误报,直接阻断会迫使团队
      # 在最坏的时间点(紧急修复时)忽略整个工具。先建立可见性,再逐步抬基线。
      - name: Bandit security lint (non-blocking)
        continue-on-error: true
        run: |
          python -m pip install bandit
          python -m bandit -r backend/app -f json -o bandit-report.json --exit-zero || true
          python -m bandit -r backend/app --exit-zero || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-${{ matrix.os }}-py${{ matrix.python }}
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 14
      - run: python -m pytest --basetemp .pytest-ci -p no:cacheprovider
      # Mini-MEB 记忆体验基准（规范: AI优化/MemoryOS-BenchmarkHarness.md §4）。
      # 每 PR 跑核心用例；评测在临时库里跑，产出报告后再用契约校验器把关，
      # 防止字段缺失的报告被下游门禁与控制台消费。
      # 只在一个 matrix 组合上跑：评测测的是记忆层逻辑，与 OS/Python 版本无关，
      # 四个组合都跑纯属浪费 CI 时间。
      - name: Mini-MEB memory benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python scripts/run_meb.py --suite mini --fail-under 1.0 \
            --compare-baseline --regression-threshold 0.05
      - name: Validate MEB report contract
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/run_meb.py --check-only
      - run: python -m pip_audit -r backend/requirements.txt -r backend/requirements-dev.txt

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/console-vue/package-lock.json
      - working-directory: frontend/console-vue
        run: npm ci
      - working-directory: frontend/console-vue
        run: npm run build
      - name: Verify dist artifact is real
        working-directory: frontend/console-vue
        shell: bash
        run: |
          test -d dist || { echo "dist/ missing after build"; exit 1; }
          test -n "$(find dist -type f -print -quit)" || { echo "dist/ is empty after build"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          grep -q 'id="app"' dist/index.html || { echo "dist/index.html lacks the #app mount point"; exit 1; }
          grep -q '宛委·枢忆' dist/index.html || { echo "dist/index.html lacks the expected title marker"; exit 1; }
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)" || { echo "dist/assets has no JS bundle"; exit 1; }
      - name: Upload console artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-vue-dist
          path: frontend/console-vue/dist
          if-no-files-found: error
          retention-days: 1
      - working-directory: frontend/console-vue
        run: npm run test:security
      - working-directory: frontend/console-vue
        run: npm run test:contracts
      - working-directory: desktop
        run: npm test

  integration:
    name: HTTP integration smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Download console artifact
        uses: actions/download-artifact@v4
        with:
          name: console-vue-dist
          path: frontend/console-vue/dist
      - name: Start application
        shell: bash
        env:
          WANWEI_API_KEY: ci-integration-key-with-32-characters
          WANWEI_MEMORY_DB: ${{ runner.temp }}/wanwei-integration.db
          WANWEI_PRODUCTION: "1"
        run: |
          # 每次运行生成一次性 Fernet 密钥（32 字节 urlsafe base64），避免把
          # 形似真实密钥的固定值提交进公开仓库。集成库为一次性临时库，无需持久密钥。
          export WANWEI_ENCRYPTION_KEY="$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8010 --no-proxy-headers > "$RUNNER_TEMP/wanwei.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wanwei.pid"
          for _ in {1..40}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=2).read()"; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/wanwei.log"
          exit 1
      - name: Run delivery smoke
        run: python scripts/smoke.py --api-key ci-integration-key-with-32-characters
      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/wanwei.log"
      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/wanwei.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/wanwei.pid")" || true
          fi

  container:
    name: Hardened container smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wanwei-shuyi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root image metadata
        run: test "$(docker image inspect wanwei-shuyi:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Run locked-down container
        shell: bash
        run: |
          docker run --detach --name wanwei-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /data:rw,noexec,nosuid,size=64m,uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e WANWEI_API_KEY=ci-container-key-with-32-characters \
            -e WANWEI_ENCRYPTION_KEY="$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -p 127.0.0.1:8010:8010 wanwei-shuyi:ci
          for _ in {1..60}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=2).read()"; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs wanwei-ci
          exit 1
      - run: python scripts/smoke.py --api-key ci-container-key-with-32-characters
      - name: Show container log on failure
        if: failure()
        run: docker logs wanwei-ci
      - name: Stop container
        if: always()
        run: docker rm --force --volumes wanwei-ci || true
